<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Declaração ASHPS - IR 2026</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
    <style>
        :root { --primary: #6a1b9a; --primary-dark: #4a148c; --secondary: #f3e5f5; --accent: #ce93d8; --text: #333; --bg: #f8f9fa; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); padding: 20px; }
        .container { background: white; padding: 40px; max-width: 1050px; margin: auto; border-radius: 16px; box-shadow: 0 10px 40px rgba(0,0,0,0.1); }
        h2 { color: var(--primary); border-bottom: 3px solid var(--secondary); padding-bottom: 10px; text-align: center; margin-bottom: 30px; }
        h3 { color: var(--primary); margin-top: 30px; font-size: 1.1em; border-left: 5px solid var(--primary); padding: 8px 15px; background: var(--secondary); border-radius: 0 8px 8px 0; }
        label { display: block; margin-top: 15px; font-weight: 600; font-size: 0.85em; color: #666; text-transform: uppercase; }
        input, select, textarea { width: 100%; padding: 12px; margin-top: 5px; border: 2px solid #ddd; border-radius: 10px; box-sizing: border-box; font-size: 14px; font-family: inherit; }
        .input-destaque { background: #e3f2fd; color: #1565c0; font-weight: bold; border-color: #90caf9; }
        .grid-4 { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 15px; }
        .grid-3 { display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 20px; }
        .grid-7 { display: grid; grid-template-columns: 1fr 1.2fr 1fr 0.8fr 0.7fr 1fr 1fr; gap: 15px; }
        .btn-main { width: 100%; padding: 18px; margin-top: 30px; background: var(--primary); color: white; border: none; border-radius: 12px; cursor: pointer; font-weight: bold; font-size: 18px; transition: 0.3s; }
        .btn-main:hover { background: var(--primary-dark); transform: translateY(-2px); }
        .status-bar { padding: 10px; border-radius: 8px; margin-top: 5px; font-size: 0.85em; font-weight: 500; }
        .ok { background: #e8f5e9; color: #2e7d32; }
        .warn { background: #fff3e0; color: #ef6c00; }
        .total-box { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 15px; margin-top: 30px; }
        .card-total { background: #fff; border: 2px solid #eee; padding: 20px; border-radius: 12px; text-align: center; }
        .card-liq { border-color: var(--primary); background: var(--secondary); }
        .card-liq input { color: var(--primary); font-weight: 800; font-size: 1.8em; border: none; background: transparent; text-align: center; width: 100%; }
        #boxMemoria { display: none; background: #1e1e1e; color: #4af626; padding: 20px; border-radius: 8px; font-family: monospace; white-space: pre-wrap; margin-top: 15px; border: 2px solid #333; }
        .remove-btn { background: #ff5252; color: white; border: none; border-radius: 50%; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h2>Gerador de Declaração ASHPS - IR 2026</h2>

    <div class="grid-4">
        <div>
            <label>1. Importar Planilha</label>
            <input type="file" id="fileImport" accept=".xlsx,.xls,.csv" onchange="processarPlanilha(event)">
            <div id="statusMsg" class="status-bar warn">Aguardando arquivo...</div>
        </div>
        <div>
            <label>2. Exceções VERTE</label>
            <textarea id="txtPdfVerte" rows="1" placeholder="Ctrl+V PDF..." oninput="processarTextoPDF()" style="resize: vertical; min-height: 48px;"></textarea>
        </div>
        <div>
            <label>3. Logo PDF</label>
            <input type="file" id="fileLogo" accept="image/*" onchange="carregarLogo(event)">
        </div>
        <div>
            <label>4. Localizar Pessoa</label>
            <input list="listaBusca" id="inputBusca" oninput="selecionarAssociado()" placeholder="Digite o nome...">
            <datalist id="listaBusca"></datalist>
        </div>
    </div>

    <hr>

    <h3>Dados do Beneficiário Titular</h3>
    <div class="grid-3">
        <div><label>Nome Completo</label><input id="nomeTitular"></div>
        <div><label>CPF</label><input id="cpfTitular" oninput="mascaraCPF(this)"></div>
        <div><label>Matrícula</label><input id="matTitular"></div>
    </div>

    <div class="grid-7" style="margin-top: 20px;">
        <div><label>Nascimento</label><input type="date" id="nascTitular" onchange="atualizarValores()"></div>
        <div>
            <label>Plano de Saúde</label>
            <select id="selConvenio" onchange="mudarConvenio()">
                <option value="UNIMAX">UNIMAX (8%)</option>
                <option value="UNIFACIL" selected>UNIFÁCIL (8%)</option>
                <option value="UNIPART">UNIPART (8%)</option>
                <option value="VERTE">VERTE SAÚDE (10%)</option>
                <option value="CCG TOP LIFE">CCG TOP LIFE (20%)</option>
                <option value="CCG MULTI">CCG MULTI (11,11%)</option>
                <option value="UNIODONTO">UNIODONTO (31%)</option>
                <option value="ODONTO EMPRESAS">ODONTO EMPRESAS (63,5%)</option>
                <option value="ODONTOPREV">ODONTOPREV (5%)</option>
                <option value="ODONTO UNIFACIL">ODONTO UNIFÁCIL (0%)</option>
            </select>
        </div>
        <div>
            <label>Mês Reajuste</label>
            <select id="selMesReajuste" onchange="atualizarValores()">
                <option value="0">Sem Reajuste</option>
                <option value="1">1 - Jan</option>
                <option value="2">2 - Fev</option>
                <option value="3">3 - Março</option>
                <option value="11">11 - Nov</option>
            </select>
        </div>
        <div><label>% Reajuste</label><input type="number" id="inputPercReajuste" step="0.01" value="0.00" onchange="atualizarValores()"></div>
        <div><label>Qtd Meses</label><input type="number" id="qtdMesesTitular" value="12" min="1" max="12" onchange="atualizarValores()"></div>
        <div><label>Bruto Total</label><input type="number" id="titBruto" step="0.01" oninput="calcularLiquido(this, 'titLiquido')"></div>
        <div><label>Líquido p/ IR</label><input type="number" id="titLiquido" class="input-destaque" step="0.01" oninput="calcularBruto(this, 'titBruto')"></div>
    </div>

    <h3>Dependentes / Coparticipações</h3>
    <div id="areaDeps"></div>
    <button class="btn-add" onclick="novoDependente()">+ Adicionar Dependente/Item</button>

    <div class="total-box">
        <div class="card-total card-liq">
            <span>TOTAL A DECLARAR (Soma Líquida)</span>
            <input type="text" id="displayTotalLiquido" readonly value="0,00">
        </div>
    </div>

    <button class="btn-main" onclick="gerarPDF()">BAIXAR PDF (ANO-BASE 2025)</button>
    <button style="width:100%; margin-top:10px;" onclick="toggleLog()">Exibir Memória de Cálculo</button>
    <div id="boxMemoria"></div>
</div>

<script>
    const bancoLocal = new Map();
    let logoBase64Custom = "";
    
    // VALORES ATUALIZADOS CONFORME NOVA PLANILHA (VALOR FINAL COM ASHPS)
    const precos = {
        UNIMAX: [456.13, 524.51, 602.98, 693.70, 797.72, 925.45, 1119.73, 1455.85, 1965.32, 2733.37],
        UNIFACIL: [121.70, 165.82, 198.49, 226.56, 235.68, 240.05, 298.23, 342.87, 471.90, 730.27],
        UNIPART: [293.05, 351.37, 411.73, 472.39, 501.11, 577.89, 717.96, 909.91, 1199.45, 1757.99],
        VERTE: [99.99, 114.96, 132.22, 152.03, 174.85, 200.60, 245.33, 318.91, 430.54, 599.78],
        "CCG TOP LIFE": [267.34, 310.92, 349.74, 391.98, 435.18, 476.33, 614.61, 685.39, 882.50, 1294.58],
        "CCG MULTI": [238.97, 300.93, 326.73, 354.21, 369.33, 417.13, 589.71, 711.15, 1106.15, 1256.49],
        UNIODONTO: Array(10).fill(38.88),
        "ODONTO EMPRESAS": Array(10).fill(25.75),
        ODONTOPREV: Array(10).fill(36.38),
        "ODONTO UNIFACIL": Array(10).fill(19.55)
    };

    const taxas = { 
        UNIMAX: 0.08, UNIFACIL: 0.08, UNIPART: 0.08, VERTE: 0.10, 
        "CCG TOP LIFE": 0.20, "CCG MULTI": 0.1111, UNIODONTO: 0.31, 
        "ODONTO EMPRESAS": 0.635, ODONTOPREV: 0.05, "ODONTO UNIFACIL": 0 
    };

    const cnpjs = {
        UNIMAX: { nome: "UNIMED PORTO ALEGRE", cnpj: "87.096.616/0001-96" },
        UNIFACIL: { nome: "UNIMED PORTO ALEGRE", cnpj: "87.096.616/0001-96" },
        CCG: { nome: "CLINIPAM (CCG)", cnpj: "76.882.612/0001-17" },
        VERTE: { nome: "VERTE SAÚDE", cnpj: "92.741.016/0001-73" }
    };

    function mudarConvenio() {
        const conv = document.getElementById('selConvenio').value;
        if (conv.includes('UNIMAX')) {
            document.getElementById('selMesReajuste').value = "11";
            document.getElementById('inputPercReajuste').value = "14.00";
        } else {
            document.getElementById('selMesReajuste').value = "0";
            document.getElementById('inputPercReajuste').value = "0.00";
        }
        atualizarValores();
    }

    function atualizarValores() {
        const nasc = document.getElementById('nascTitular').value;
        const conv = document.getElementById('selConvenio').value;
        const taxa = taxas[conv] || 0;
        const mesReaj = parseInt(document.getElementById('selMesReajuste').value);
        const percReaj = parseFloat(document.getElementById('inputPercReajuste').value) / 100;
        const qtdMeses = parseInt(document.getElementById('qtdMesesTitular').value) || 12;

        let brutoAnual = 0;
        let log = `Cálculo para ${conv}:\n`;

        if(nasc) {
            const anoNasc = parseInt(nasc.split('-')[0]);
            const mesNasc = parseInt(nasc.split('-')[1]);
            
            for(let m=1; m<=qtdMeses; m++) {
                let idade = 2025 - anoNasc;
                if(m < mesNasc) idade--;

                let idx = 0;
                if(idade <= 18) idx=0; else if(idade <= 23) idx=1; else if(idade <= 28) idx=2;
                else if(idade <= 33) idx=3; else if(idade <= 38) idx=4; else if(idade <= 43) idx=5;
                else if(idade <= 48) idx=6; else if(idade <= 53) idx=7; else if(idade <= 58) idx=8; else idx=9;

                let valorMes = precos[conv][idx];
                if(mesReaj > 0 && m >= mesReaj) valorMes = valorMes * (1 + percReaj);
                
                valorMes = Number(valorMes.toFixed(2));
                brutoAnual += valorMes;
            }
        }
        document.getElementById('titBruto').value = brutoAnual.toFixed(2);
        calcularLiquido(document.getElementById('titBruto'), 'titLiquido');
    }

    function calcularLiquido(el, destId) {
        const conv = document.getElementById('selConvenio').value;
        const taxa = taxas[conv] || 0;
        const liq = parseFloat(el.value) / (1 + taxa);
        document.getElementById(destId).value = liq.toFixed(2);
        somarTudo();
    }

    function calcularBruto(el, destId) {
        const conv = document.getElementById('selConvenio').value;
        const taxa = taxas[conv] || 0;
        const bruto = parseFloat(el.value) * (1 + taxa);
        document.getElementById(destId).value = bruto.toFixed(2);
        somarTudo();
    }

    function somarTudo() {
        let totalLiq = parseFloat(document.getElementById('titLiquido').value) || 0;
        document.querySelectorAll('.dep-liq').forEach(input => {
            totalLiq += parseFloat(input.value) || 0;
        });
        document.getElementById('displayTotalLiquido').value = totalLiq.toLocaleString('pt-BR', {minimumFractionDigits: 2});
    }

    function novoDependente() {
        const div = document.createElement('div');
        div.className = 'item-box';
        div.innerHTML = `
            <div class="grid-3">
                <input placeholder="Nome Dependente / Item" class="dep-nome">
                <input type="number" placeholder="Bruto" step="0.01" oninput="calcularLinha(this, 'L')">
                <input type="number" placeholder="Líquido" step="0.01" class="dep-liq" oninput="calcularLinha(this, 'B')">
                <button class="remove-btn" onclick="this.parentElement.parentElement.remove(); somarTudo();">X</button>
            </div>
        `;
        document.getElementById('areaDeps').appendChild(div);
    }

    function calcularLinha(el, tipo) {
        const conv = document.getElementById('selConvenio').value;
        const taxa = taxas[conv] || 0;
        const row = el.parentElement;
        if(tipo === 'L') {
            const v = parseFloat(el.value) / (1 + taxa);
            row.querySelector('.dep-liq').value = v.toFixed(2);
        } else {
            const v = parseFloat(el.value) * (1 + taxa);
            row.querySelectorAll('input')[1].value = v.toFixed(2);
        }
        somarTudo();
    }

    function processarPlanilha(e) {
        const file = e.target.files[0];
        const reader = new FileReader();
        reader.onload = (evt) => {
            const wb = XLSX.read(evt.target.result, { type: 'binary' });
            const ws = wb.Sheets[wb.SheetNames[0]];
            const dados = XLSX.utils.sheet_to_json(ws);
            dados.forEach(r => {
                const nome = String(r.NOME || r.Nome || "").toUpperCase().trim();
                if(nome) bancoLocal.set(nome, r);
            });
            document.getElementById('statusMsg').textContent = "Planilha Carregada!";
            document.getElementById('statusMsg').className = "status-bar ok";
            
            const list = document.getElementById('listaBusca');
            bancoLocal.forEach((v, k) => {
                const opt = document.createElement('option');
                opt.value = k;
                list.appendChild(opt);
            });
        };
        reader.readAsBinaryString(file);
    }

    function selecionarAssociado() {
        const nome = document.getElementById('inputBusca').value.toUpperCase();
        const p = bancoLocal.get(nome);
        if(p) {
            document.getElementById('nomeTitular').value = nome;
            document.getElementById('cpfTitular').value = p.CPF || p.Cpf || "";
            document.getElementById('matTitular').value = p.MATRICULA || p.Matricula || "";
            let nasc = p.NASCIMENTO || p.Nasc || "";
            if(typeof nasc === 'number') {
                const d = XLSX.SSF.parse_date_code(nasc);
                nasc = `${d.y}-${String(d.m).padStart(2,'0')}-${String(d.d).padStart(2,'0')}`;
            }
            document.getElementById('nascTitular').value = nasc;
            atualizarValores();
        }
    }

    function mascaraCPF(i) {
        let v = i.value.replace(/\D/g, "");
        v = v.replace(/(\d{3})(\d)/, "$1.$2").replace(/(\d{3})(\d)/, "$1.$2").replace(/(\d{3})(\d{1,2})$/, "$1-$2");
        i.value = v;
    }

    function toggleLog() {
        const b = document.getElementById('boxMemoria');
        b.style.display = b.style.display === 'block' ? 'none' : 'block';
    }

    async function gerarPDF() {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF();
        const total = document.getElementById('displayTotalLiquido').value;
        const nome = document.getElementById('nomeTitular').value;
        const cpf = document.getElementById('cpfTitular').value;
        const conv = document.getElementById('selConvenio').value;

        doc.setFontSize(16);
        doc.text("DECLARAÇÃO DE PAGAMENTOS - IR 2026", 105, 40, {align: "center"});
        doc.setFontSize(12);
        doc.text(`Beneficiário: ${nome}`, 20, 60);
        doc.text(`CPF: ${cpf}`, 20, 70);
        doc.text(`Ano-Base: 2025`, 20, 80);
        
        let txt = `Declaramos que o associado acima efetuou pagamentos à ASHPS no valor total de R$ ${total} referente ao plano ${conv} no período de 01/01/2025 a 31/12/2025.`;
        doc.text(doc.splitTextToSize(txt, 170), 20, 100);
        
        doc.text("Porto Alegre, " + new Date().toLocaleDateString(), 20, 150);
        doc.save(`Declaracao_${nome}.pdf`);
    }
</script>
</body>
</html>
