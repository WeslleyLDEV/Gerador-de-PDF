<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Declaração ASHPS - IR 2026 (Base 2025)</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
    <style>
        :root { --primary: #6a1b9a; --primary-dark: #4a148c; --secondary: #f3e5f5; --accent: #ce93d8; --text: #333; --bg: #f8f9fa; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); padding: 20px; }
        .container { background: white; padding: 40px; max-width: 1050px; margin: auto; border-radius: 16px; box-shadow: 0 10px 40px rgba(0,0,0,0.1); }
        h2 { color: var(--primary); border-bottom: 3px solid var(--secondary); padding-bottom: 10px; text-align: center; margin-bottom: 30px; }
        h3 { color: var(--primary); margin-top: 30px; font-size: 1.1em; border-left: 5px solid var(--primary); padding: 8px 15px; background: var(--secondary); border-radius: 0 8px 8px 0; }
        label { display: block; margin-top: 15px; font-weight: 600; font-size: 0.85em; color: #666; text-transform: uppercase; }
        input, select, textarea { width: 100%; padding: 12px; margin-top: 5px; border: 2px solid #ddd; border-radius: 10px; box-sizing: border-box; font-size: 14px; font-family: inherit; }
        .input-destaque { background: #e3f2fd; color: #1565c0; font-weight: bold; border-color: #90caf9; }
        .grid-4 { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 15px; }
        .grid-3 { display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 20px; }
        .grid-7 { display: grid; grid-template-columns: 1fr 1.2fr 1fr 0.8fr 0.7fr 1fr 1fr; gap: 15px; }
        .btn-main { width: 100%; padding: 18px; margin-top: 30px; background: var(--primary); color: white; border: none; border-radius: 12px; cursor: pointer; font-weight: bold; font-size: 18px; transition: 0.3s; }
        .btn-main:hover { background: var(--primary-dark); transform: translateY(-2px); }
        .btn-add { background: white; color: var(--primary); border: 2px solid var(--primary); padding: 10px 20px; border-radius: 8px; cursor: pointer; margin-top: 15px; font-weight: 600; }
        .item-box { border: 1px solid #ddd; padding: 20px; margin-top: 15px; border-radius: 12px; position: relative; background: #fafafa; display: grid; gap: 15px; align-items: end; }
        .remove-btn { position: absolute; right: 10px; top: 10px; background: #ff5252; color: white; border: none; border-radius: 50%; width: 22px; height: 22px; cursor: pointer; font-weight: bold;}
        .status-bar { padding: 10px; border-radius: 8px; margin-top: 5px; font-size: 0.85em; font-weight: 500; }
        .ok { background: #e8f5e9; color: #2e7d32; }
        .warn { background: #fff3e0; color: #ef6c00; }
        .total-box { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 15px; margin-top: 30px; }
        .card-total { background: #fff; border: 2px solid #eee; padding: 20px; border-radius: 12px; text-align: center; }
        .card-liq { border-color: var(--primary); background: var(--secondary); }
        .card-liq input { color: var(--primary); font-weight: 800; font-size: 1.8em; border: none; text-align: center; background: transparent; width: 100%; }
        #boxMemoria { display: none; background: #1e1e1e; color: #4af626; padding: 20px; border-radius: 8px; font-family: monospace; white-space: pre-wrap; margin-top: 15px; border: 2px solid #333; }
    </style>
</head>
<body>

<div class="container">
    <h2>Gerador de Declaração ASHPS - IR 2026</h2>

    <div class="grid-4">
        <div>
            <label>1. Importar Planilha</label>
            <input type="file" id="fileImport" accept=".xlsx,.xls,.csv" onchange="processarPlanilha(event)">
            <div id="statusMsg" class="status-bar warn">Aguardando arquivo...</div>
        </div>
        <div>
            <label>2. Exceções VERTE</label>
            <textarea id="txtPdfVerte" rows="1" placeholder="Ctrl+V PDF..." oninput="processarTextoPDF()" style="min-height: 48px;"></textarea>
            <div id="statusPdf" class="status-bar warn">Opcional</div>
        </div>
        <div>
            <label>3. Logo (Opcional)</label>
            <input type="file" id="fileLogo" accept="image/*" onchange="carregarLogo(event)">
        </div>
        <div>
            <label>4. Localizar Pessoa</label>
            <input list="listaBusca" id="inputBusca" oninput="selecionarAssociado()" placeholder="Digite o nome...">
            <datalist id="listaBusca"></datalist>
        </div>
    </div>

    <hr>

    <h3>Dados do Beneficiário Titular (Ano-Base 2025)</h3>
    <div class="grid-3">
        <div><label>Nome Completo</label><input id="nomeTitular"></div>
        <div><label>CPF</label><input id="cpfTitular" placeholder="000.000.000-00" oninput="mascaraCPF(this)"></div>
        <div><label>Matrícula</label><input id="matTitular"></div>
    </div>

    <div class="grid-7" style="margin-top: 20px;">
        <div>
            <label>Nascimento</label>
            <input type="date" id="nascTitular" onchange="atualizarValores()">
        </div>
        <div>
            <label>Plano de Saúde</label>
            <select id="selConvenio" onchange="mudarPlano()">
                <option value="UNIMAX">UNIMAX (8%)</option>
                <option value="UNIFACIL" selected>UNIFÁCIL (8%)</option>
                <option value="UNIPART">UNIPART (8%)</option>
                <option value="VERTE">VERTE SAÚDE (10%)</option>
                <option value="CCG TOP LIFE">CCG TOP LIFE (20%)</option>
                <option value="CCG MULTI">CCG MULTI (11,11%)</option>
                <option value="UNIODONTO">UNIODONTO (31%)</option>
                <option value="ODONTO EMPRESAS">ODONTO EMPRESAS (63,5%)</option>
                <option value="ODONTOPREV">ODONTOPREV (5%)</option>
                <option value="ODONTO UNIFACIL">ODONTO UNIFÁCIL (0%)</option>
            </select>
        </div>
        <div>
            <label>Mês Reajuste</label>
            <select id="selMesReajuste" onchange="atualizarValores()">
                <option value="0">Sem Reajuste</option>
                <option value="3">3 - Março</option>
                <option value="4">4 - Abril</option>
                <option value="7">7 - Julho</option>
                <option value="11">11 - Nov</option>
            </select>
        </div>
        <div>
            <label>% Reajuste</label>
            <input type="number" id="inputPercReajuste" step="0.01" value="0.00" onchange="atualizarValores()">
        </div>
        <div>
            <label>Meses Pagos</label>
            <input type="number" id="qtdMesesTitular" value="12" min="1" max="12" onchange="atualizarValores()">
        </div>
        <div>
            <label>Bruto Total</label>
            <input type="number" id="titBruto" step="0.01" value="0.00" readonly>
        </div>
        <div>
            <label>Líquido p/ IR</label>
            <input type="number" id="titLiquido" class="input-destaque" step="0.01" value="0.00" readonly>
        </div>
    </div>

    <h3>Dependentes / Adicionais</h3>
    <div id="areaDeps"></div>
    <button class="btn-add" onclick="novoDependente()">+ Adicionar Dependente</button>

    <div class="total-box">
        <div class="card-total card-liq" style="grid-column: span 3;">
            <span>TOTAL A DECLARAR (LÍQUIDO)</span>
            <input type="text" id="displayTotalLiquido" readonly value="R$ 0,00">
        </div>
    </div>

    <button class="btn-main" onclick="gerarPDF()">BAIXAR DECLARAÇÃO EM PDF</button>
    <h3 style="cursor: pointer;" onclick="toggleLog()">📜 Ver Memória de Cálculo</h3>
    <div id="boxMemoria"></div>
</div>

<script>
    const precos = {
        UNIMAX: [456.13, 524.51, 602.98, 693.70, 797.74, 925.46, 1119.74, 1455.85, 1965.32, 2733.37],
        UNIFACIL: [121.70, 165.82, 198.49, 226.56, 235.68, 240.05, 298.23, 342.87, 471.90, 730.27],
        UNIPART: [293.05, 351.37, 411.73, 472.39, 501.11, 577.89, 717.96, 909.91, 1199.45, 1757.99],
        VERTE: [99.99, 114.96, 132.22, 152.03, 174.85, 200.60, 245.33, 318.91, 430.54, 599.78],
        "CCG TOP LIFE": [267.34, 310.92, 349.74, 392.01, 435.18, 476.36, 614.60, 685.40, 882.50, 1294.58],
        "CCG MULTI": [238.97, 300.93, 326.73, 354.21, 369.33, 417.13, 589.71, 711.15, 1106.15, 1256.49],
        UNIODONTO: Array(10).fill(38.88),
        "ODONTO EMPRESAS": Array(10).fill(25.75),
        ODONTOPREV: Array(10).fill(36.38),
        "ODONTO UNIFACIL": Array(10).fill(19.55)
    };

    const taxas = { 
        UNIMAX: 0.08, UNIFACIL: 0.08, UNIPART: 0.08, VERTE: 0.10, 
        "CCG TOP LIFE": 0.20, "CCG MULTI": 0.1111, UNIODONTO: 0.31, 
        "ODONTO EMPRESAS": 0.635, ODONTOPREV: 0.05, "ODONTO UNIFACIL": 0 
    };

    const configuracoesReajuste = {
        UNIMAX: { mes: 11, perc: 14 },
        UNIPART: { mes: 11, perc: 14 },
        UNIFACIL: { mes: 3, perc: 5 },
        VERTE: { mes: 11, perc: 17.12 },
        "CCG TOP LIFE": { mes: 0, perc: 0 },
        UNIODONTO: { mes: 0, perc: 8 }
    };

    const bancoLocal = new Map();

    function mudarPlano() {
        const conv = document.getElementById('selConvenio').value;
        const config = configuracoesReajuste[conv] || { mes: 0, perc: 0 };
        document.getElementById('selMesReajuste').value = config.mes;
        document.getElementById('inputPercReajuste').value = config.perc.toFixed(2);
        atualizarValores();
    }

    function processarPlanilha(e) {
        const file = e.target.files[0];
        const reader = new FileReader();
        reader.onload = (evt) => {
            const wb = XLSX.read(evt.target.result, { type: 'binary' });
            const dados = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: "A", defval: "" });
            bancoLocal.clear();
            dados.forEach((linha, idx) => {
                if (idx === 0) return;
                const nome = String(linha.B).toUpperCase().trim();
                if(nome) bancoLocal.set(nome, { Matricula: linha.A, Cpf: linha.C, Nascimento: linha.D });
            });
            document.getElementById('statusMsg').textContent = `✓ ${bancoLocal.size} cadastros prontos!`;
            document.getElementById('statusMsg').className = "status-bar ok";
            popularDatalist();
        };
        reader.readAsBinaryString(file);
    }

    function popularDatalist() {
        const list = document.getElementById('listaBusca');
        list.innerHTML = "";
        bancoLocal.forEach((v, k) => {
            const opt = document.createElement('option');
            opt.value = k;
            list.appendChild(opt);
        });
    }

    function selecionarAssociado() {
        const nome = document.getElementById('inputBusca').value.toUpperCase();
        const p = bancoLocal.get(nome);
        if(!p) return;
        document.getElementById('nomeTitular').value = nome;
        document.getElementById('matTitular').value = p.Matricula;
        document.getElementById('cpfTitular').value = p.Cpf;
        if(p.Nascimento) {
            const data = typeof p.Nascimento === 'number' ? 
                XLSX.SSF.parse_date_code(p.Nascimento) : {y:1970, m:1, d:1};
            document.getElementById('nascTitular').value = `${data.y}-${String(data.m).padStart(2,'0')}-${String(data.d).padStart(2,'0')}`;
        }
        atualizarValores();
    }

    function atualizarValores() {
        const nasc = document.getElementById('nascTitular').value;
        const conv = document.getElementById('selConvenio').value;
        const taxa = taxas[conv] || 0;
        const mesReaj = parseInt(document.getElementById('selMesReajuste').value);
        const percReaj = parseFloat(document.getElementById('inputPercReajuste').value) / 100;
        const qtdMeses = parseInt(document.getElementById('qtdMesesTitular').value) || 12;

        let brutoAcumulado = 0;
        let liquidoAcumulado = 0;
        let log = `CÁLCULO PARA: ${conv} (Ano 2025)\n`;

        if(nasc) {
            const [anoN, mesN] = nasc.split('-').map(Number);
            for(let m = 1; m <= qtdMeses; m++) {
                let idade = 2025 - anoN;
                if(m < mesN) idade--;
                
                let idx = 0;
                if(idade <= 18) idx=0; else if(idade <= 23) idx=1; else if(idade <= 28) idx=2;
                else if(idade <= 33) idx=3; else if(idade <= 38) idx=4; else if(idade <= 43) idx=5;
                else if(idade <= 48) idx=6; else if(idade <= 53) idx=7; else if(idade <= 58) idx=8; else idx=9;

                let valorBase = precos[conv][idx];
                if(mesReaj > 0 && m >= mesReaj) {
                    valorBase = Number((valorBase * (1 + percReaj)).toFixed(2));
                }
                
                let liqMes = Number((valorBase / (1 + taxa)).toFixed(2));
                brutoAcumulado += valorBase;
                liquidoAcumulado += liqMes;
                log += `Mês ${m}: Idade ${idade} -> Bruto R$ ${valorBase.toFixed(2)} | Líq R$ ${liqMes.toFixed(2)}\n`;
            }
        }

        document.getElementById('titBruto').value = brutoAcumulado.toFixed(2);
        document.getElementById('titLiquido').value = liquidoAcumulado.toFixed(2);
        document.getElementById('boxMemoria').textContent = log;
        somarGeral();
    }

    function somarGeral() {
        let total = parseFloat(document.getElementById('titLiquido').value) || 0;
        document.querySelectorAll('.dep-liq').forEach(input => {
            total += parseFloat(input.value) || 0;
        });
        document.getElementById('displayTotalLiquido').value = `R$ ${total.toLocaleString('pt-BR', {minimumFractionDigits:2})}`;
    }

    function novoDependente() {
        const area = document.getElementById('areaDeps');
        const div = document.createElement('div');
        div.className = 'item-box';
        div.innerHTML = `
            <button class="remove-btn" onclick="this.parentElement.remove(); somarGeral();">×</button>
            <div style="display:grid; grid-template-columns: 2fr 1fr 1fr; gap:10px;">
                <div><label>Nome</label><input placeholder="Nome do Dependente"></div>
                <div><label>Bruto Anual</label><input type="number" class="dep-bruto" step="0.01" value="0.00" oninput="calcDep(this)"></div>
                <div><label>Líquido IR</label><input type="number" class="dep-liq input-destaque" step="0.01" value="0.00" readonly></div>
            </div>
        `;
        area.appendChild(div);
    }

    function calcDep(el) {
        const conv = document.getElementById('selConvenio').value;
        const taxa = taxas[conv] || 0;
        const bruto = parseFloat(el.value) || 0;
        const liqInput = el.parentElement.nextElementSibling.querySelector('input');
        liqInput.value = (bruto / (1 + taxa)).toFixed(2);
        somarGeral();
    }

    function mascaraCPF(i) {
        let v = i.value.replace(/\D/g, "");
        v = v.replace(/(\d{3})(\d)/, "$1.$2").replace(/(\d{3})(\d)/, "$1.$2").replace(/(\d{3})(\d{1,2})$/, "$1-$2");
        i.value = v;
    }

    function toggleLog() {
        const box = document.getElementById('boxMemoria');
        box.style.display = box.style.display === 'block' ? 'none' : 'block';
    }

    async function gerarPDF() {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF();
        const nome = document.getElementById('nomeTitular').value || "ASSOCIADO";
        const total = document.getElementById('displayTotalLiquido').value;
        
        doc.setFontSize(16);
        doc.text("DECLARAÇÃO DE PAGAMENTOS - ANO BASE 2025", 105, 40, {align:"center"});
        doc.setFontSize(12);
        doc.text(`Nome: ${nome}`, 20, 60);
        doc.text(`CPF: ${document.getElementById('cpfTitular').value}`, 20, 70);
        doc.text(`Valor Total Declarado: ${total}`, 20, 90);
        doc.text(`Porto Alegre, ${new Date().toLocaleDateString('pt-BR')}`, 105, 150, {align:"center"});
        
        doc.save(`Declaracao_ASHPS_${nome}.pdf`);
    }
</script>
</body>
</html>
